services:
  backend: &backend
    build: ./backend
    ports:
      - "8000:8000"
    environment: &backend_environment
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_API_BASE: ${LLM_API_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      PORT: 8000
    volumes:
      - sqlite_data:/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

  public-backend:
    <<: *backend
    profiles: ["public"]
    ports: []
    environment:
      <<: *backend_environment
      ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:-}
    volumes:
      - public_sqlite_data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --protocol http2 --url http://public-backend:8000
    restart: unless-stopped
    depends_on:
      - public-backend

volumes:
  sqlite_data:
  public_sqlite_data:
