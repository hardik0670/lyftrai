services:
  - type: web
    name: lyftrai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
